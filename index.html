<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="음성일기" />
  <title>보이스 다이어리 - 나의 음성 일기장</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 상단 헤더 -->
    <header class="app-header">
      <div class="header-left">
        <span class="app-logo" aria-hidden="true">🎙️</span>
        <div>
          <h1 class="app-title">보이스 다이어리</h1>
          <p class="app-subtitle" id="todayLabel"></p>
        </div>
      </div>
      <button type="button" class="status-pill" id="syncStatusPill" title="연결 상태 확인">
        <span class="status-dot"></span>
        <span id="syncStatusText">로컬 모드</span>
      </button>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="app-main">
      <!-- 1. 기록 탭 -->
      <section class="tab-panel active" id="panel-record" aria-label="일기 기록">
        <div class="voice-card">
          <div class="voice-controls">
            <button type="button" class="mic-button" id="micBtn" aria-label="음성 인식 시작">
              <span class="mic-ring"></span>
              <span class="mic-icon" id="micIcon">🎤</span>
            </button>
            <div class="voice-status">
              <strong id="voiceStateTitle">마이크를 눌러 말해보세요</strong>
              <span id="voiceStateHint">한국어 음성 인식이 실시간으로 텍스트로 변환됩니다</span>
            </div>
          </div>
          <div class="interim-box hidden" id="interimBox">
            <span class="interim-badge">인식 중</span>
            <span id="interimText"></span>
          </div>
        </div>

        <div class="form-card">
          <div class="form-row-split">
            <label class="field-group">
              <span class="field-label">날짜</span>
              <input type="date" id="entryDate" class="text-input" />
            </label>
            <label class="field-group">
              <span class="field-label">시간</span>
              <input type="time" id="entryTime" class="text-input" />
            </label>
          </div>

          <div class="field-group">
            <div class="label-row">
              <span class="field-label">날씨</span>
              <button type="button" class="text-btn" id="refreshWeatherBtn">📍 자동 날씨</button>
            </div>
            <input
              type="text"
              id="entryWeather"
              class="text-input"
              placeholder="위치 확인 중... (직접 입력도 가능)"
            />
          </div>

          <div class="field-group">
            <div class="label-row">
              <span class="field-label">오늘의 이야기</span>
              <button type="button" class="text-btn" id="clearContentBtn">지우기</button>
            </div>
            <textarea
              id="entryContent"
              class="diary-textarea"
              rows="6"
              placeholder="마이크로 말하거나 직접 일기를 작성해보세요..."
            ></textarea>
          </div>

          <div class="ai-bar">
            <div class="ai-btn-group">
              <button type="button" class="ai-btn" id="spellCheckBtn">
                <span>✍️</span>
                <span>맞춤법 검사</span>
              </button>
              <button type="button" class="text-btn hidden" id="undoSpellBtn">↩️ 되돌리기</button>
            </div>
            <span class="ai-hint">오탈자·띄어쓰기 자동 정리</span>
          </div>

          <button type="button" class="primary-btn" id="saveEntryBtn">
            구글 시트에 일기 저장하기
          </button>
        </div>
      </section>

      <!-- 2. 목록 탭 -->
      <section class="tab-panel" id="panel-list" aria-label="일기 목록">
        <div class="search-card">
          <div class="search-row">
            <input
              type="search"
              id="searchInput"
              class="text-input search-input"
              placeholder="날짜, 날씨, 일기 내용 검색..."
            />
            <button type="button" class="icon-btn" id="refreshListBtn" title="시트에서 새로고침">
              🔄
            </button>
          </div>
        </div>

        <div id="entriesContainer" class="entries-list"></div>
      </section>

      <!-- 3. 설정 탭 -->
      <section class="tab-panel" id="panel-settings" aria-label="설정">
        <div class="form-card">
          <h2 class="section-title">구글 시트 연동 (Apps Script)</h2>
          <p class="section-desc">
            구글 시트에 <code>Code.gs</code>를 배포하고 발급받은 웹 앱 URL을 입력하세요.
            URL을 입력하지 않으면 기기 내부(로컬)에만 저장됩니다.
          </p>
          <label class="field-group">
            <span class="field-label">Apps Script 웹 앱 URL</span>
            <input
              type="url"
              id="appsScriptUrlInput"
              class="text-input"
              placeholder="https://script.google.com/macros/s/.../exec"
            />
          </label>
          <div class="btn-row">
            <button type="button" class="secondary-btn" id="testConnectionBtn">연결 테스트</button>
            <button type="button" class="primary-btn" id="saveSettingsBtn">설정 저장</button>
          </div>
        </div>

        <div class="form-card">
          <h2 class="section-title">음성 인식 &amp; AI 맞춤법 설정</h2>
          <label class="field-group">
            <span class="field-label">음성 인식 언어</span>
            <select id="speechLangSelect" class="text-input">
              <option value="ko-KR">한국어 (ko-KR)</option>
              <option value="en-US">English (en-US)</option>
              <option value="ja-JP">日本語 (ja-JP)</option>
            </select>
          </label>

          <label class="field-group">
            <span class="field-label">Gemini API 키 (선택)</span>
            <input
              type="password"
              id="geminiApiKeyInput"
              class="text-input"
              placeholder="AIza... (입력 시 AI 맞춤법 교정 활성화)"
            />
          </label>
          <p class="section-desc">
            API 키는 서버로 전송되지 않고 현재 브라우저의 로컬 저장소에만 보관됩니다.
            키가 없어도 기본 맞춤법·띄어쓰기 정리는 동작합니다.
          </p>
        </div>

        <div class="form-card">
          <h2 class="section-title">화면 및 데이터</h2>
          <div class="btn-row">
            <button type="button" class="secondary-btn" id="toggleThemeBtn">🌙 다크/라이트 전환</button>
            <button type="button" class="secondary-btn" id="exportJsonBtn">📥 백업 내보내기</button>
          </div>
        </div>
      </section>
    </main>

    <!-- 하단 네비게이션 -->
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button type="button" class="nav-item active" data-tab="record">
        <span class="nav-icon">🎙️</span>
        <span class="nav-label">기록</span>
      </button>
      <button type="button" class="nav-item" data-tab="list">
        <span class="nav-icon">📖</span>
        <span class="nav-label">일기장</span>
      </button>
      <button type="button" class="nav-item" data-tab="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">설정</span>
      </button>
    </nav>
  </div>

  <!-- 토스트 알림 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
